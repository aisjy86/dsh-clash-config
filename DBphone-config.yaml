  # Cloudflare WARP（2026-11-13 注册）
  # ⚠ 2026-11-18 实测已失效：/proxies/WARP/delay 对 gstatic 与 x.com 均 504。
  # 保留仅为备用，不要选它做默认出口。
  - name: WARP
    type: wireguard
    server: engage.cloudflareclient.com
    port: 2408
    ip: 172.16.0.2
    private-key: qAfbhF4NBDEy9yCOw4RWkynMxrWDU/wXo8EoM2HNckE=
    public-key: bmXOC+F1FxEMF9dyiK2H5/1SUtzH0JuVo51h2wPfgyo=
    udp: true
    mtu: 1280
    reserved: [216,32,238]
proxy-groups:
  # X 专用出口：默认 MANUAL（WARP 已失效，垫底备用）
  - name: X视频
    type: select
    proxies:
      - MANUAL
      - AUTO
      - WARP

  # 默认节点：实测吞吐最高（vmess-3201 | USA，1.95 MB/s）
  - name: MANUAL
    type: select
    proxies:
      - "vmess-3201 | USA"
      - "ss-138 | ITA #7"
      - "ss-133 | ITA #9"
      - "ss-137 | ITA #5"
      - "vless-5737 | NLD"
      - "ss-136 IT_4|1.1MB/s"
      - "vless-5739 | SWE"
      - "vless-5795 +V2CROSS.COM"
      - "ss-131 | ITA #3"
      - "trojan-2320 | NGA #2"

  - name: AUTO
    type: url-test
    proxies:
      - "vmess-3201 | USA"
      - "ss-138 | ITA #7"
      - "ss-133 | ITA #9"
      - "ss-137 | ITA #5"
      - "vless-5737 | NLD"
      - "ss-136 IT_4|1.1MB/s"
      - "vless-5739 | SWE"
      - "vless-5795 +V2CROSS.COM"
      - "ss-131 | ITA #3"
      - "trojan-2320 | NGA #2"
    url: "https://www.gstatic.com/generate_204"
    interval: 1800
    tolerance: 200
    lazy: true
rules:
  # ===== X / Twitter 走 WARP =====
  - DOMAIN-SUFFIX,twimg.com,X视频
  - DOMAIN-SUFFIX,x.com,X视频
  - DOMAIN-SUFFIX,twitter.com,X视频
  - DOMAIN-SUFFIX,t.co,X视频
  # grok.com 是 xAI 官网，不是 X 的视频 CDN，走 WARP 会超时，保持普通节点

  # xAI / X
  - DOMAIN-SUFFIX,x.ai,MANUAL
  - DOMAIN-SUFFIX,x.com,MANUAL
  - DOMAIN-SUFFIX,twimg.com,MANUAL
  - DOMAIN-SUFFIX,twitter.com,MANUAL
  - DOMAIN-SUFFIX,grok.com,MANUAL

  # Anthropic / Claude
  # 2026-11-18：机房节点池访问 claude 曾被判 app-unavailable-in-region，
  # 必须走 Anthropic 认可地区的出口；MANUAL 默认是实测可用的美国节点。
  - DOMAIN-SUFFIX,claude.ai,MANUAL
  - DOMAIN-SUFFIX,claude.com,MANUAL
  - DOMAIN-SUFFIX,anthropic.com,MANUAL
  - DOMAIN-SUFFIX,claudeusercontent.com,MANUAL

  # ===== Google Play 专项（国行设备）=====
  # 国行 Play 用 services.googleapis.cn（不是 .com），会被后面的
  # DOMAIN-SUFFIX,cn,DIRECT 抓住直连，导致商店服务连不上 →"一直转圈/等待中"。
  # 这条必须放在 cn 直连规则之前。
  - DOMAIN-SUFFIX,services.googleapis.cn,MANUAL

  # Play 下载走 Google 在国内的 CDN（北京 2x3 / 上海 ni5 / 广州 j5o），
  # 域名形如 rr4---sn-j5o7dn7s.xn--ngstr-lra8j.com（ångström 的 Punycode）。
  # 这些节点本来就在国内，走代理绕到国外再回来必定超时 —— 必须直连。
  - DOMAIN-REGEX,^r+[0-9]+(---|\.)sn-(2x3|ni5|j5o)\w{5}\.xn--ngstr-lra8j\.com$,DIRECT

  # 上游 v2fly/domain-list-community data/google-play 里标记 @cn 的两条，我们之前漏了
  - DOMAIN,redirector.c.play.google.com,DIRECT
  - DOMAIN,redirector.xn--ngstr-lra8j.com,DIRECT

  # Play 商店的图片/资源域名（图标、截图），走代理即可
  - DOMAIN-SUFFIX,googleplay.com,MANUAL
  - DOMAIN,play-fe.googleapis.com,MANUAL
  - DOMAIN,play-lh.googleusercontent.com,MANUAL

  # 其余 ångström CDN（海外节点）走代理
  - DOMAIN-SUFFIX,xn--ngstr-lra8j.com,MANUAL

  # Play 下载链路：和 PC 端保持一致（PC 实测能下、手机之前也能下）
  # 关键教训：dl.google.com / gvt1.com 解析到 Google 国内 CDN（180.163.x），
  # 必须直连。之前这里写成"下载加速"（15 节点轮询代理），等于把国内 CDN
  # 绕到国外再回来，任何一个节点死掉分片就卡在"等待中"。
  - DOMAIN,dl.google.com,DIRECT
  - DOMAIN-SUFFIX,gvt1.com,DIRECT
  # 真正需要出国的 Play API 走单一节点（不要用 load-balance 轮询，
  # 分片分散到不同节点反而更容易卡住）
  - DOMAIN,play.googleapis.com,MANUAL
  - DOMAIN,android.clients.google.com,MANUAL
  - DOMAIN-SUFFIX,googleusercontent.com,MANUAL

