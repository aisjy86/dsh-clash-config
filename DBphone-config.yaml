# ☁ mihomo / clash 手机配置 —— DBphone-config.yaml（2026-11-18 新增文件）
#
# 来源：fresh-1118 新节点池（15 个源聚合 → 4981 条 → 实测 google+x 都通的 10 个）
# 本文件是**新增**，不替换 phone-config.yaml：
#   - 本地 phone-config.yaml 未改动
#   - 云端 aisjy86/dsh-clash-config@main/phone-config.yaml 未改动
#   - 新 URL：https://cdn.jsdelivr.net/gh/aisjy86/dsh-clash-config@main/DBphone-config.yaml
#
# 与旧手机配置的区别：
#   1. 节点换成新池 10 个（按实测吞吐排序：vmess-3201 USA 1.95MB/s 最快）
#   2. X视频 组默认改成 MANUAL —— WARP 在 2026-11-18 实测两个探活地址都 504 已失效，
#      只留在列表末尾备用，不再做默认出口（旧配置里 X 打不开就是这个原因）
#   3. 分流规则沿用旧手机配置那一套（Play 专项 / 豆包 Coze 直连 / 国内直连、
#      兜底 MATCH,MANUAL）
#   4. 组名统一成 MANUAL / AUTO，PC 端可直接对照
mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
ipv6: false
# 性能相关：并发建连（避免串行握手拖慢首包）
tcp-concurrent: true
# 只测一次延迟，不做双次采样
unified-delay: true
# 关闭 sniffer：它会解析并改写 TLS 目标，Play 的 Cronet 下载器对此敏感。

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "localhost.ptlogin2.qq.com"
    # 注意：不要给 Google 域名加 fake-ip-filter。
    # 实测这么做会让 gvt1.com 拿到被污染的国内 IP（202.101.48.97），
    # Cronet 连上去 TLS 必定被断。保持假 IP，让节点做远端解析才是对的。
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  fallback:
    - tls://8.8.8.8:853
    - tls://1.1.1.1:853
  fallback-filter:
    geoip: false
    ipcidr:
      - 240.0.0.0/4


