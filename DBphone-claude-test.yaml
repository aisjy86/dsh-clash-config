# ☁ 诊断专用极简配置 —— DBphone-claude-test.yaml（2026-11-18 新增）
#
# 目的：排除一切干扰，只留 1 个「浏览器实测两关都过」的美国节点，且全部流量走它（MATCH 直指代理）。
#
# 用法：在手机 Clash 里把订阅临时换成这个地址 → 用手机浏览器打开
#       https://claude.ai/cdn-cgi/trace
#   - loc=US  → 说明手机代理链路正常，问题在规则/订阅上
#   - loc=CN 或打不开 → 说明手机的 VPN/TUN 没接管流量，代理根本没生效
# 测完切回正式订阅 https://cdn.jsdelivr.net/gh/aisjy86/dsh-clash-config@main/DBphone-config-v2.yaml
#
# 不影响任何现有文件（本地 phone-config.yaml / DBphone-config.yaml / v2 都没动）

mixed-port: 7890
allow-lan: false
mode: global
log-level: warning
ipv6: false
tcp-concurrent: true
unified-delay: true

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  fallback:
    - tls://8.8.8.8:853
    - tls://1.1.1.1:853
  fallback-filter:
    geoip: false
    ipcidr:
      - 240.0.0.0/4

proxies:
  # 浏览器实测：US 落地 / 无 Cloudflare 验证 / 地区通过
  - { name: "US-1", type: vmess, server: 192.74.236.148, port: 30004, uuid: 418048af-a293-4b99-9b0c-98ca3580dd24, alterId: 64, cipher: auto, tls: true, network: ws, skip-cert-verify: true, ws-opts: { path: /path/1733477783705 } }

proxy-groups:
  - name: US
    type: select
    proxies:
      - US-1

rules:
  - MATCH,US
