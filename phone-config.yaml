  # Cloudflare WARP（免费）：出口是 Cloudflare 段 104.28.x，
  # 与节点池的 GTHost 段完全不同，专门用来承载 X 相关流量试视频风控。
  # 注意：WARP 在墙内到 Google/YouTube 不通，只能给 X 用，不要全局套。
  - name: WARP
    type: wireguard
    server: engage.cloudflareclient.com
    port: 2408
    ip: 172.16.0.2
    private-key: qAfbhF4NBDEy9yCOw4RWkynMxrWDU/wXo8EoM2HNckE=
    public-key: bmXOC+F1FxEMF9dyiK2H5/1SUtzH0JuVo51h2wPfgyo=
    udp: true
    mtu: 1280
    reserved: [216,32,238]

proxy-groups:
  # X 专用出口：默认 WARP，可手动切回普通节点
  - name: X视频
    type: select
    proxies:
      - WARP
      - 自动选择
      - 节点选择

  # 默认选中"实测吞吐最高"的那个节点（第一个），而不是 自动选择。
  # 原因：url-test 按延迟排序，延迟低不等于带宽高；TikTok/视频需要带宽。
  - name: 节点选择
    type: select
    proxies:
      - "ss-832 @i10VPN"
      - 自动选择
      - "ss-840 @Shh_Proxy-New"
      - "ss-838 211608 | Telegram = t.me/SOSkeyNET"
      - "ss-831 @Shh_Proxy-New"
      - "ss-845 @i10VPN"
      - "ss-844 @confing_v2rayy"
      - "ss-835 YFZ 207 @Outline_Vpn"
      - "ss-813 @confing_v2rayy"
      - "ss-841 @confing_v2rayy"
      - "ss-859 @i10VPN"
      - "ss-1185 IT-202.50.253.18-0212"
      - "ss-851 @appsooner"
      - "ss-816 @tik7net_vpn"
      - "ss-815 @EXPRESSVPN_420"
      - "ss-814 @vpnbaz"

  # 下载专用：负载均衡组。Play 下载是多分片并发，单节点容易被限速或直接断，
  # 分散到多个节点能显著提高成功率与总吞吐。
  - name: 下载加速
    type: load-balance
    strategy: round-robin
    proxies:
      - "ss-832 @i10VPN"
      - "ss-840 @Shh_Proxy-New"
      - "ss-838 211608 | Telegram = t.me/SOSkeyNET"
      - "ss-831 @Shh_Proxy-New"
      - "ss-845 @i10VPN"
      - "ss-844 @confing_v2rayy"
      - "ss-835 YFZ 207 @Outline_Vpn"
      - "ss-813 @confing_v2rayy"
      - "ss-841 @confing_v2rayy"
      - "ss-859 @i10VPN"
      - "ss-1185 IT-202.50.253.18-0212"
      - "ss-851 @appsooner"
      - "ss-816 @tik7net_vpn"
      - "ss-815 @EXPRESSVPN_420"
      - "ss-814 @vpnbaz"
    url: "https://www.gstatic.com/generate_204"
    interval: 600
    tolerance: 100
    lazy: true

  - name: 自动选择
    type: url-test
    proxies:
      - "ss-832 @i10VPN"
      - "ss-840 @Shh_Proxy-New"
      - "ss-838 211608 | Telegram = t.me/SOSkeyNET"
      - "ss-831 @Shh_Proxy-New"
      - "ss-845 @i10VPN"
      - "ss-844 @confing_v2rayy"
      - "ss-835 YFZ 207 @Outline_Vpn"
      - "ss-813 @confing_v2rayy"
      - "ss-841 @confing_v2rayy"
      - "ss-859 @i10VPN"
      - "ss-1185 IT-202.50.253.18-0212"
      - "ss-851 @appsooner"
      - "ss-816 @tik7net_vpn"
      - "ss-815 @EXPRESSVPN_420"
      - "ss-814 @vpnbaz"
    url: "https://www.gstatic.com/generate_204"
    interval: 1800
    tolerance: 200
    lazy: true

rules:
  # ===== X / Twitter 走 WARP =====
  - DOMAIN-SUFFIX,twimg.com,X视频
  - DOMAIN-SUFFIX,x.com,X视频
  - DOMAIN-SUFFIX,twitter.com,X视频
  - DOMAIN-SUFFIX,t.co,X视频
  # grok.com 是 xAI 官网，不是 X 的视频 CDN，走 WARP 会超时，保持普通节点

  # xAI / X
  - DOMAIN-SUFFIX,x.ai,节点选择
  - DOMAIN-SUFFIX,x.com,节点选择
  - DOMAIN-SUFFIX,twimg.com,节点选择
  - DOMAIN-SUFFIX,twitter.com,节点选择
  - DOMAIN-SUFFIX,grok.com,节点选择
  # ===== Google Play 专项（国行设备）=====
  # 国行 Play 用 services.googleapis.cn（不是 .com），会被后面的
  # DOMAIN-SUFFIX,cn,DIRECT 抓住直连，导致商店服务连不上 →"一直转圈/等待中"。
  # 这条必须放在 cn 直连规则之前。
  - DOMAIN-SUFFIX,services.googleapis.cn,节点选择

  # Play 下载走 Google 在国内的 CDN（北京 2x3 / 上海 ni5 / 广州 j5o），
  # 域名形如 rr4---sn-j5o7dn7s.xn--ngstr-lra8j.com（ångström 的 Punycode）。
  # 这些节点本来就在国内，走代理绕到国外再回来必定超时 —— 必须直连。
  - DOMAIN-REGEX,^r+[0-9]+(---|\.)sn-(2x3|ni5|j5o)\w{5}\.xn--ngstr-lra8j\.com$,DIRECT

  # 上游 v2fly/domain-list-community data/google-play 里标记 @cn 的两条，我们之前漏了
  - DOMAIN,redirector.c.play.google.com,DIRECT
  - DOMAIN,redirector.xn--ngstr-lra8j.com,DIRECT

  # Play 商店的图片/资源域名（图标、截图），走代理即可
  - DOMAIN-SUFFIX,googleplay.com,节点选择
  - DOMAIN,play-fe.googleapis.com,节点选择
  - DOMAIN,play-lh.googleusercontent.com,节点选择

  # 其余 ångström CDN（海外节点）走代理
  - DOMAIN-SUFFIX,xn--ngstr-lra8j.com,节点选择

  # Play 下载链路：和 PC 端保持一致（PC 实测能下、手机之前也能下）
  # 关键教训：dl.google.com / gvt1.com 解析到 Google 国内 CDN（180.163.x），
  # 必须直连。之前这里写成"下载加速"（15 节点轮询代理），等于把国内 CDN
  # 绕到国外再回来，任何一个节点死掉分片就卡在"等待中"。
  - DOMAIN,dl.google.com,DIRECT
  - DOMAIN-SUFFIX,gvt1.com,DIRECT
  # 真正需要出国的 Play API 走单一节点（不要用 load-balance 轮询，
  # 分片分散到不同节点反而更容易卡住）
  - DOMAIN,play.googleapis.com,节点选择
  - DOMAIN,android.clients.google.com,节点选择
  - DOMAIN-SUFFIX,googleusercontent.com,节点选择

  # Google / YouTube
  - DOMAIN-SUFFIX,google.com,节点选择
