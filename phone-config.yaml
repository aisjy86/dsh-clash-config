    reserved: [216,32,238]

proxy-groups:
  # X 专用出口：默认 WARP，可手动切回普通节点
  - name: X视频
    type: select
    proxies:
      - WARP
      - 自动选择
      - 节点选择

  - name: 节点选择
    type: select
    proxies:
      - 自动选择
