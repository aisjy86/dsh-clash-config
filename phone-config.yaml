# mihomo / clash 手机配置（由桌面版导出）
# 节点：15 个（按实测吞吐排序，带宽优先）
# 适用：Clash Meta for Android / FlClash / Karing / Streisand / sing-box(需转换)
mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
ipv6: false
# 性能相关：并发建连（避免串行握手拖慢首包）
tcp-concurrent: true
# 只测一次延迟，不做双次采样
unified-delay: true
# 关闭 sniffer：它会解析并改写 TLS 目标，Play 的 Cronet 下载器对此敏感。

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "localhost.ptlogin2.qq.com"
    # 注意：不要给 Google 域名加 fake-ip-filter。
    # 实测这么做会让 gvt1.com 拿到被污染的国内 IP（202.101.48.97），
    # Cronet 连上去 TLS 必定被断。保持假 IP，让节点做远端解析才是对的。
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  fallback:
    - tls://8.8.8.8:853
    - tls://1.1.1.1:853
  fallback-filter:
    geoip: false
    ipcidr:
      - 240.0.0.0/4

